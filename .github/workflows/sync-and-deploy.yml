name: Sync and Deploy

on:
  schedule:
    # 每小时整点执行一次
    - cron: '0 * * * *'
  workflow_dispatch:
    # 支持手动触发
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: true

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        env:
          GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/sync-upstream.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/v1.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "上游无变化"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "检测到上游更新"
          fi

      - name: Commit synced data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add data/v1.json data/.sync-meta.json
          git commit -m "chore: 同步上游仓库更新 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Build (download resources and replace v1.json links)
        env:
          BASE_URL: https://komari-market.mikus.ink
        run: node scripts/build.js

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            logs/
          retention-days: 7

      - name: Print build meta
        run: |
          if [ -f dist/.build-meta.json ]; then
            echo "=== Build Meta ==="
            cat dist/.build-meta.json
          fi
          if [ -f data/.sync-meta.json ]; then
            echo "=== Sync Meta ==="
            cat data/.sync-meta.json
          fi

      - name: Commit dist resources (CDN assets)
        run: |
          if [ -z "$(git status --porcelain dist/)" ]; then
            echo "dist 无变化，跳过提交"
          else
            git add dist/
            git commit -m "chore: 更新构建产物与加速资源 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

      - name: Deploy to EdgeOne Pages
        env:
          EDGEOONE_API_TOKEN: ${{ secrets.EDGEOONE_API_TOKEN }}
        run: |
          if [ -z "$EDGEOONE_API_TOKEN" ]; then
            echo "未配置 EDGEOONE_API_TOKEN，跳过 EdgeOne 部署（将由 EdgeOne Git 集成自动部署）"
          else
            npx edgeone makers deploy ./dist -n theme-market-cn
          fi
