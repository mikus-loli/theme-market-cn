name: Sync Upstream and Deploy

on:
  schedule:
    # 每 1 小时同步一次
    - cron: '0 * * * *'
  workflow_dispatch:  # 支持手动触发
  push:
    branches:
      - main

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Install dependencies
        run: |
          npm install -g edgeone
          npm install

      - name: Sync upstream repository
        env:
          UPSTREAM_REPO: ${{ secrets.UPSTREAM_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始同步上游仓库..."
          node scripts/sync-upstream.js

      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "没有发现更新"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "发现更新，准备提交..."
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git commit -m "chore: 同步上游仓库更新 $(date '+%Y-%m-%d %H:%M:%S')"
          git push

      - name: Build project
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run build

      - name: Deploy to EdgeOne Pages
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          echo "开始部署到 EdgeOne Pages..."
          npx edgeone makers deploy ./dist \
            -n theme-market-cn \
            -t $EDGEONE_API_TOKEN \
            --env production

      - name: Notify deployment result
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "✅ 部署完成！"
          echo "访问地址：https://theme-market-cn.edgeonepages.com"